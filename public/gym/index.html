<style>
/* Layout: single mobile column (max 560px), sticky workout header, fixed bottom nav + rest bar; one bold hero, quiet cards elsewhere */
:root {
  --bg: #F2F3F6; --surface: #FFFFFF; --surface2: #E9EBF0; --line: #DADDE4; --fg: #13161C; --muted: #626A78;
  --accent: #2B55E6; --accent-ink: #FFFFFF; --accent-soft: #E3E9FD; --hero1: #1D3FC0; --hero2: #2B55E6;
  --good: #14935A; --good-soft: #DDF3E8; --warn: #B86E00; --warn-soft: #FBEEDB; --bad: #D0384A; --bad-soft: #FBE3E6;
  --gold: #B8860B; --gold-soft: #FBF1D6; --shadow: 0 1px 2px rgba(20,24,40,.06), 0 6px 20px rgba(20,24,40,.06);
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --f-body: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 16px; --nav-h: 64px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D0F13; --surface: #171A20; --surface2: #21252D; --line: #2B3039; --fg: #EDEFF3; --muted: #8E96A4;
  --accent: #5E86FF; --accent-ink: #0A0F22; --accent-soft: #1B2542; --hero1: #2344C8; --hero2: #3D66F0;
  --good: #3DD68C; --good-soft: #13291F; --warn: #F2A93B; --warn-soft: #2E2413; --bad: #FF6B7A; --bad-soft: #321A1E;
  --gold: #F5C04A; --gold-soft: #2E2612; --shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 8px 24px rgba(0,0,0,.35); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0D0F13; --surface: #171A20; --surface2: #21252D; --line: #2B3039; --fg: #EDEFF3; --muted: #8E96A4;
  --accent: #5E86FF; --accent-ink: #0A0F22; --accent-soft: #1B2542; --hero1: #2344C8; --hero2: #3D66F0;
  --good: #3DD68C; --good-soft: #13291F; --warn: #F2A93B; --warn-soft: #2E2413; --bad: #FF6B7A; --bad-soft: #321A1E;
  --gold: #F5C04A; --gold-soft: #2E2612; --shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 8px 24px rgba(0,0,0,.35); color-scheme: dark; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--fg); font: 15px/1.45 var(--f-body); margin: 0; padding: 0 16px calc(var(--nav-h) + 90px + env(safe-area-inset-bottom, 0px)); min-height: 100%; }
body.locked { overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
button:disabled { opacity: .35; cursor: default; }
input, textarea, select { font: inherit; color: var(--fg); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg { width: 20px; height: 20px; flex: none; }
#app { max-width: 560px; margin: 0 auto; }
.view { display: flex; flex-direction: column; gap: 16px; padding-block: 8px 24px; animation: fadein .25s ease; }
@keyframes fadein { from { opacity: .4; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* type helpers */
.muted { color: var(--muted); } .xs { font-size: 12px; } .sm { font-size: 13px; } .num { font-variant-numeric: tabular-nums; }
.good { color: var(--good); } .bad { color: var(--bad); } .grow { flex: 1; min-width: 0; } .block { display: block; } .center { text-align: center; } .mt { margin-top: 20px; } .pad-t { padding-top: 10px; }
.eyebrow, .lbl, .lbl-h { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.lbl-h { margin: 6px 2px 8px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.title { font: 700 30px/1.05 var(--f-display); letter-spacing: .01em; text-transform: uppercase; }
.title.sm { font-size: 24px; }
h2 { font: 700 19px/1.1 var(--f-display); text-transform: uppercase; letter-spacing: .03em; }
h3 { font: 700 22px/1.15 var(--f-display); text-transform: uppercase; letter-spacing: .02em; margin-bottom: 8px; }

/* top bar */
.topbar { display: flex; align-items: center; gap: 10px; padding-top: 10px; }
.tb-text { flex: 1; min-width: 0; }
.tb-text .title { overflow-wrap: anywhere; }
.iconbtn { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); flex: none; font: 700 13px var(--f-display); }
.iconbtn.sm { width: 36px; height: 36px; border-radius: 10px; }
.iconbtn.sm svg { width: 17px; height: 17px; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 12px; font-weight: 700; font-size: 14px; transition: transform .08s, background .15s; white-space: nowrap; }
.btn:active:not(:disabled) { transform: scale(.97); }
.btn svg { width: 18px; height: 18px; }
.btn.big { min-height: 54px; font-size: 16px; width: 100%; border-radius: 14px; }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 13px; border-radius: 10px; }
.btn.solid { background: var(--accent); color: var(--accent-ink); }
.btn.outline { border: 1.5px solid var(--line); background: var(--surface); }
.btn.ghost { color: var(--accent); }
.btn.danger { background: var(--bad); color: #fff; }
.btn.danger-ghost { color: var(--bad); }
.link { color: var(--accent); font-weight: 700; font-size: 13px; display: inline-flex; align-items: center; gap: 4px; text-decoration: none; }
.link svg { width: 16px; height: 16px; }
.row-btns { display: flex; flex-wrap: wrap; gap: 10px; }
.row-btns .btn { flex: 1 1 140px; }
.tag { display: inline-flex; align-items: center; gap: 3px; font-size: 10px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; padding: 2px 7px; border-radius: 99px; background: var(--surface2); color: var(--muted); margin-left: 6px; vertical-align: middle; }
.tag svg { width: 11px; height: 11px; }
.tag.acc { background: var(--accent-soft); color: var(--accent); }
.tag.pr { background: var(--gold-soft); color: var(--gold); }

/* chips & segmented */
.chips { display: flex; gap: 8px; }
.chips.wrap { flex-wrap: wrap; }
.chips.scroll { overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding: 2px 16px; }
.chips.scroll::-webkit-scrollbar { display: none; }
.chip { flex: none; min-height: 36px; padding: 0 14px; border-radius: 99px; border: 1.5px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 600; white-space: nowrap; display: inline-flex; align-items: center; }
.chip.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.seg { display: flex; background: var(--surface2); border-radius: 12px; padding: 3px; gap: 2px; }
.seg button { flex: 1; min-height: 38px; border-radius: 9px; font-size: 13px; font-weight: 700; color: var(--muted); text-align: center; padding: 0 6px; }
.seg button.on { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
.stepper { display: inline-flex; align-items: center; background: var(--surface2); border-radius: 12px; }
.stepper button { width: 40px; height: 40px; font-size: 20px; font-weight: 600; text-align: center; color: var(--accent); }
.stepper span { min-width: 56px; text-align: center; font: 700 18px var(--f-display); font-variant-numeric: tabular-nums; }

/* cards & sections */
.sec { display: flex; flex-direction: column; gap: 10px; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 0 2px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.card.list { padding: 4px 0; }
.empty { color: var(--muted); text-align: center; padding: 24px 12px; border: 1.5px dashed var(--line); border-radius: var(--r); display: flex; flex-direction: column; gap: 12px; align-items: center; }
.empty.big { padding: 40px 16px; }
.month { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 10px 2px 2px; }
.chev { color: var(--muted); display: grid; place-items: center; }
.chev svg { width: 18px; height: 18px; }

/* demo banner */
.demo-banner { display: flex; flex-direction: column; gap: 12px; padding: 14px; border-radius: var(--r); background: var(--warn-soft); border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); }
.demo-banner b { display: block; color: var(--warn); }
.demo-banner span { font-size: 13px; }
.demo-banner .btn { white-space: normal; text-align: center; min-height: 48px; }

/* hero: the one bold element */
.hero { position: relative; overflow: hidden; border-radius: 22px; padding: 20px 18px 16px; color: #fff; background: linear-gradient(145deg, var(--hero1), var(--hero2)); display: flex; flex-direction: column; gap: 10px; }
.hero::after { content: ""; position: absolute; right: -60px; top: -60px; width: 220px; height: 220px; border-radius: 50%; border: 26px solid rgba(255,255,255,.07); box-shadow: 0 0 0 22px rgba(255,255,255,.04); pointer-events: none; }
.hero .eyebrow { color: rgba(255,255,255,.75); }
.hero-name { font: 700 46px/.95 var(--f-display); text-transform: uppercase; letter-spacing: .005em; overflow-wrap: anywhere; }
.hero-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.hero .mchip { background: rgba(255,255,255,.16); color: #fff; }
.mchip { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 99px; background: var(--surface2); }
.hero-list { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.hero-list li { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px solid rgba(255,255,255,.12); padding-bottom: 6px; }
.hero-list li span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hero-list .num { font: 600 16px var(--f-display); display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; }
.hero-list .num svg { width: 14px; height: 14px; color: #9FF5C8; }
.hero-list .muted { color: rgba(255,255,255,.7); border: 0; }
.hero-meta { font-size: 13px; color: rgba(255,255,255,.8); }
.hero p.muted { color: rgba(255,255,255,.8); margin: 0; }
.hero .btn.solid { background: #fff; color: #0F1B4D; margin-top: 4px; }
.hero .btn.ghost { color: #fff; }
.hero-alt { display: flex; justify-content: center; gap: 4px; }

/* this week */
.week { display: flex; align-items: center; gap: 12px; justify-content: space-between; flex-wrap: wrap; }
.wk-n { display: flex; align-items: baseline; gap: 6px; }
.wk-n b { font: 700 40px/1 var(--f-display); }
.wk-n span { color: var(--muted); font-weight: 600; }
.wk-days { display: flex; gap: 6px; }
.wd { display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; color: var(--muted); }
.wd i { width: 26px; height: 26px; border-radius: 8px; background: var(--surface2); display: block; }
.wd.plan i { box-shadow: inset 0 0 0 1.5px var(--line); background: transparent; }
.wd.hit i { background: var(--accent); box-shadow: none; }
.wd.today span { color: var(--fg); }
.wd.today i { outline: 2px solid var(--fg); outline-offset: 2px; }

/* coach insights */
.ins-list { display: flex; flex-direction: column; gap: 8px; }
.ins { display: flex; gap: 12px; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.ins-ic { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; flex: none; background: var(--accent-soft); color: var(--accent); }
.ins-ic svg { width: 18px; height: 18px; }
.k-up .ins-ic, .k-volume .ins-ic, .k-sets .ins-ic { background: var(--good-soft); color: var(--good); }
.k-down .ins-ic, .k-rest .ins-ic, .k-stall .ins-ic { background: var(--warn-soft); color: var(--warn); }
.k-pr .ins-ic { background: var(--gold-soft); color: var(--gold); }
.k-muscle .ins-ic { background: var(--bad-soft); color: var(--bad); }
.ins-t { font-weight: 800; font-size: 14px; }
.ins-b { font-size: 13px; color: var(--muted); margin-top: 2px; }
.ins-a { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.ins-a .btn { white-space: normal; text-align: left; }

/* muscle recovery */
.due-line { display: flex; gap: 8px; align-items: center; font-size: 13px; margin-bottom: 12px; }
.due-line svg { color: var(--accent); width: 18px; height: 18px; }
.mgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.mcell { position: relative; border-radius: 12px; padding: 9px 10px 12px; background: var(--surface2); display: flex; flex-direction: column; overflow: hidden; }
.mc-n { font-size: 12px; font-weight: 700; }
.mc-d { font: 700 20px/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.mcell i { position: absolute; left: 0; bottom: 0; height: 4px; width: calc(var(--p) * 100%); background: currentColor; }
.s-recovering { color: var(--muted); } .s-ready { color: var(--good); } .s-due { color: var(--accent); } .s-overdue { color: var(--bad); } .s-never { color: var(--muted); }
.mcell .mc-n { color: var(--fg); }
.legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; font-size: 11px; font-weight: 600; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 10px; height: 4px; border-radius: 2px; background: currentColor; }

/* last workout, PRs, highlights */
.last-card { display: flex; flex-direction: column; gap: 12px; width: 100%; }
.lc-top { display: flex; justify-content: space-between; gap: 12px; }
.lc-name { font: 700 22px/1.1 var(--f-display); text-transform: uppercase; }
.lc-stats { display: flex; gap: 14px; text-align: right; }
.lc-stats b { display: block; font: 700 20px/1 var(--f-display); }
.lc-stats span { font-size: 11px; color: var(--muted); }
.lc-lines { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.lc-lines div { display: flex; justify-content: space-between; gap: 12px; }
.lc-lines div span:first-child { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.lc-lines .num { color: var(--muted); text-align: right; }
.pr-row, .ex-row, .hist-line { display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 14px; border-bottom: 1px solid var(--line); }
.list > :last-child { border-bottom: 0; }
.pr-ic { width: 32px; height: 32px; border-radius: 10px; background: var(--gold-soft); color: var(--gold); display: grid; place-items: center; flex: none; }
.pr-ic svg { width: 16px; height: 16px; }
.pr-ex, .ex-n { font-weight: 700; font-size: 14px; }
.pr-row b.num { font: 700 17px var(--f-display); white-space: nowrap; }
.hl-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.hl { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.hl-name { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hl-val { font: 700 28px/1.05 var(--f-display); }
.hl-val small { font-size: 14px; }
.spark { width: 90px; height: 30px; margin-top: 4px; }
.split-row { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; width: 100%; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.split-row b { font: 700 20px var(--f-display); text-transform: uppercase; }
.split-row .chev { grid-row: 1 / 4; grid-column: 2; }

/* workout tab */
.day-list { display: flex; flex-direction: column; gap: 8px; }
.day-pick { display: flex; align-items: center; gap: 10px; padding: 10px 10px 10px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.day-pick.next { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.dp-name { font: 700 18px var(--f-display); text-transform: uppercase; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile { display: flex; flex-direction: column; gap: 4px; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.tile span { width: 34px; height: 34px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; margin-bottom: 4px; }
.tile b { font-size: 13px; line-height: 1.2; }
.tile small { font-size: 11px; color: var(--muted); line-height: 1.3; }
@media (max-width: 380px) { .tiles { grid-template-columns: 1fr; } .tile { flex-direction: row; align-items: center; flex-wrap: wrap; } .tile small { flex-basis: 100%; } }
.hist { display: flex; flex-direction: column; gap: 8px; }
.srow-card { display: flex; gap: 12px; align-items: center; width: 100%; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.sr-date { width: 46px; flex: none; display: flex; flex-direction: column; align-items: center; background: var(--surface2); border-radius: 12px; padding: 6px 0; }
.sr-date span { font-size: 10px; font-weight: 800; text-transform: uppercase; color: var(--muted); letter-spacing: .06em; }
.sr-date b { font: 700 22px/1 var(--f-display); }
.sr-main { flex: 1; min-width: 0; }
.sr-name { font-weight: 800; }
.sr-meta { font-size: 12px; color: var(--muted); }
.sr-ex { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* live workout */
.wk-head { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 10px; margin: 0 -16px; padding: 10px 16px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.wk-title { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; font: 700 22px var(--f-display); text-transform: uppercase; }
.wk-title span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wk-title svg { width: 15px; height: 15px; color: var(--muted); }
.wk-clock { font: 700 20px var(--f-display); color: var(--accent); }
.wk-sub { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-top: -6px; }
.wk-sub .link svg { width: 15px; height: 15px; }
.prog-bar { flex: 1 1 100%; height: 5px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
.prog-bar i { display: block; height: 100%; background: var(--good); border-radius: 3px; transition: width .3s; }
.wk-sub > span { flex: 1; }
textarea.notes { width: 100%; min-height: 70px; resize: vertical; padding: 12px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); font-size: 14px; }
textarea.notes.sm { min-height: 54px; margin-top: 10px; }
.wk-foot { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }

.xcard { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 14px; scroll-margin-top: 70px; transition: border-color .2s; }
.xcard.current { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), var(--shadow); }
.xcard.complete { border-color: color-mix(in srgb, var(--good) 45%, var(--line)); }
.xh { display: flex; align-items: center; gap: 10px; }
.xnum { width: 30px; height: 30px; flex: none; border-radius: 9px; display: grid; place-items: center; background: var(--surface2); font: 700 16px var(--f-display); }
.current .xnum { background: var(--accent); color: var(--accent-ink); }
.complete .xnum { background: var(--good); color: var(--bg); }
.xt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.xt b { font-weight: 800; font-size: 16px; line-height: 1.25; }
.xt span { font-size: 12px; color: var(--muted); }
.cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.cmp-col { background: var(--surface2); border-radius: 12px; padding: 9px 11px; font: 600 17px/1.35 var(--f-display); font-variant-numeric: tabular-nums; }
.cmp-col .lbl { display: block; font-family: var(--f-body); margin-bottom: 3px; }
.cmp-col.tgt { background: var(--accent-soft); }
.cmp-col.tgt .lbl { color: var(--accent); }
.cmp-col .up { color: var(--good); }
.cmp-col .up::after { content: " ↑"; }
.cmp-col .muted { font-family: var(--f-body); font-size: 13px; font-weight: 500; }
.advice { display: flex; flex-direction: column; gap: 2px; margin-top: 8px; padding: 9px 11px; border-radius: 12px; font-size: 13px; background: var(--surface2); border-left: 3px solid var(--muted); }
.advice b { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
.advice.m-increase { background: var(--good-soft); border-color: var(--good); } .advice.m-increase b { color: var(--good); }
.advice.m-reps { background: var(--accent-soft); border-color: var(--accent); } .advice.m-reps b { color: var(--accent); }
.advice.m-hold, .advice.m-stalled { background: var(--warn-soft); border-color: var(--warn); } .advice.m-hold b, .advice.m-stalled b { color: var(--warn); }
.advice.m-reduce { background: var(--bad-soft); border-color: var(--bad); } .advice.m-reduce b { color: var(--bad); }
.advice.sm { margin-top: 10px; }
.lastnote { display: flex; gap: 6px; align-items: flex-start; font-size: 12px; color: var(--muted); margin-top: 8px; }
.lastnote svg { width: 14px; height: 14px; margin-top: 2px; }

.sets { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }
.shd, .srow { display: grid; grid-template-columns: var(--tpl); gap: 8px; align-items: center; }
.shd span { font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); text-align: center; }
.sno { position: relative; height: 48px; border-radius: 12px; font: 700 18px var(--f-display); color: var(--muted); display: grid; place-items: center; }
.sno:active { background: var(--surface2); }
.prdot { position: absolute; top: 2px; right: 0; color: var(--gold); }
.prdot svg { width: 13px; height: 13px; }
.num-in { width: 100%; min-width: 0; height: 48px; border-radius: 12px; border: 1.5px solid transparent; background: var(--surface2); text-align: center; font: 700 22px var(--f-display); font-variant-numeric: tabular-nums; padding: 0 4px; -webkit-appearance: none; appearance: none; }
.num-in::placeholder { color: color-mix(in srgb, var(--muted) 70%, transparent); font-weight: 600; }
.num-in:focus { outline: none; border-color: var(--accent); background: var(--surface); }
.num-in.sm { font-size: 18px; }
.srow.done .num-in { background: var(--good-soft); color: var(--fg); }
.srow.done .sno { color: var(--good); }
.srow.warm .sno { color: var(--warn); }
.srow.pr .num-in { background: var(--gold-soft); }
.chk { height: 48px; border-radius: 12px; border: 1.5px solid var(--line); display: grid; place-items: center; color: var(--muted); transition: background .15s, transform .1s; }
.chk:active { transform: scale(.92); }
.srow.done .chk { background: var(--good); border-color: var(--good); color: var(--bg); }
.chk svg { width: 22px; height: 22px; stroke-width: 2.6; }
input.snote { width: 100%; height: 38px; border-radius: 10px; border: 1px dashed var(--line); background: transparent; padding: 0 10px; font-size: 13px; margin-left: 0; }
.xfoot { display: flex; gap: 4px; margin-top: 8px; flex-wrap: wrap; }
.xfoot .btn { padding: 0 10px; }
.xfoot .btn:first-child { flex: 1; justify-content: flex-start; }

/* rest timer */
#restbar { position: fixed; left: 0; right: 0; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px)); z-index: 30; padding: 0 12px 8px; pointer-events: none; }
.rest { pointer-events: auto; position: relative; overflow: hidden; max-width: 536px; margin: 0 auto; display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 14px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); }
.rest .r-ic { color: var(--muted); display: grid; }
.rest.run, .rest.pause, .rest.done { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.r-prog { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); opacity: .35; transition: width .25s linear; }
.rest.done .r-prog { background: var(--good); opacity: .6; }
.r-time { position: relative; font: 700 30px/1 var(--f-display); flex: 1; }
.r-btns { position: relative; display: flex; gap: 6px; }
.r-btns .iconbtn { background: color-mix(in srgb, var(--bg) 12%, transparent); border-color: color-mix(in srgb, var(--bg) 20%, transparent); color: inherit; }

/* session detail */
.saved-banner { display: flex; gap: 12px; align-items: center; padding: 14px; border-radius: var(--r); background: var(--good-soft); }
.saved-banner b { display: block; color: var(--good); font-size: 16px; }
.saved-banner span { font-size: 13px; }
.sb-ic { width: 40px; height: 40px; border-radius: 50%; background: var(--good); color: var(--bg); display: grid; place-items: center; flex: none; }
.stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.stat-row > div { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 6px; text-align: center; min-width: 0; }
.stat-row b { display: block; font: 700 20px/1.1 var(--f-display); white-space: nowrap; }
.stat-row span { font-size: 11px; color: var(--muted); }
.stat-row.sm > div { background: var(--surface2); border: 0; }
.hx { display: flex; flex-direction: column; gap: 6px; }
.hx-h { display: flex; flex-direction: column; }
.hx-t { width: 100%; border-collapse: collapse; font-size: 14px; }
.hx-t td { padding: 5px 4px; border-top: 1px solid var(--line); }
.hx-t td:first-child { width: 24px; }
.hx-t td b { font: 700 17px var(--f-display); }
.hx-note { display: flex; gap: 6px; align-items: center; } .hx-note svg { width: 14px; height: 14px; }
.note-card { display: flex; gap: 10px; } .note-card p { margin: 0; white-space: pre-wrap; } .note-card svg { color: var(--muted); }
.pr-card { border-color: color-mix(in srgb, var(--gold) 40%, var(--line)); }

/* forms */
.form { display: flex; flex-direction: column; gap: 14px; }
.fl { display: flex; flex-direction: column; gap: 6px; }
.fl > span { font-size: 12px; font-weight: 700; color: var(--muted); }
.fl input, .fl textarea, .fl select, .ex-sel, .big-in { width: 100%; min-height: 46px; padding: 10px 12px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); font-size: 15px; }
.fl textarea { min-height: 80px; resize: vertical; }
.fl input:focus, .fl textarea:focus, .big-in:focus { outline: none; border-color: var(--accent); }
.two { display: grid; grid-template-columns: 1.6fr 1fr; gap: 10px; }
.two > * { min-width: 0; }
.rr { display: flex; align-items: center; gap: 6px; }
.rr .num-in { width: 58px; height: 42px; font-size: 19px; }
.rr-set { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-weight: 600; font-size: 14px; }
.toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 48px; font-weight: 600; font-size: 14px; }
.sw { width: 46px; height: 28px; border-radius: 99px; background: var(--surface2); border: 1px solid var(--line); position: relative; flex: none; transition: background .2s; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--muted); transition: transform .2s, background .2s; }
.sw.on { background: var(--accent); border-color: var(--accent); }
.sw.on::after { transform: translateX(18px); background: #fff; }

/* programme */
.prog-head { display: flex; flex-direction: column; gap: 12px; }
.ph-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
.ph-row b { display: block; font: 700 26px/1 var(--f-display); }
.ph-row span { font-size: 11px; color: var(--muted); }
.ph-btns { display: flex; gap: 8px; } .ph-btns .btn { flex: 1; }
.sched { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.sc { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 2px; text-align: center; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.sc span { font-size: 10px; font-weight: 800; text-transform: uppercase; color: var(--muted); }
.sc b { font: 600 12px/1.1 var(--f-display); text-transform: uppercase; color: var(--muted); overflow-wrap: anywhere; }
.sc.on { background: var(--accent-soft); border-color: transparent; }
.sc.on b { color: var(--accent); }
.pday { display: flex; flex-direction: column; gap: 10px; }
.pd-h { display: flex; align-items: center; gap: 12px; width: 100%; }
.pd-h b { font: 700 22px/1.1 var(--f-display); text-transform: uppercase; }
.pd-i { width: 34px; height: 34px; border-radius: 10px; background: var(--fg); color: var(--bg); display: grid; place-items: center; font: 700 18px var(--f-display); flex: none; }
.pd-list { list-style: none; margin: 0; padding: 0; font-size: 14px; display: flex; flex-direction: column; }
.pd-list li { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); }
.pd-list li span:first-child { min-width: 0; }
.pd-list .num { white-space: nowrap; }
.pd-f { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.vbars { display: flex; flex-direction: column; gap: 8px; }
.vb { display: grid; grid-template-columns: 84px 1fr 36px; gap: 10px; align-items: center; font-size: 13px; font-weight: 600; }
.vb b { text-align: right; font: 700 16px var(--f-display); }
.vb-track { position: relative; height: 10px; background: var(--surface2); border-radius: 5px; overflow: hidden; }
.vb-track .zone { position: absolute; top: 0; bottom: 0; background: color-mix(in srgb, var(--good) 22%, transparent); }
.vb-track .fill { position: absolute; left: 0; top: 2px; bottom: 2px; border-radius: 4px; background: var(--good); }
.vb-track .fill.low { background: var(--accent); } .vb-track .fill.high { background: var(--warn); }
.dx { display: flex; flex-direction: column; gap: 10px; padding: 12px; }
.dx-h { display: flex; align-items: center; gap: 8px; }
.dx-o { display: flex; flex-direction: column; gap: 4px; }
.dx-o .iconbtn { width: 30px; height: 26px; border-radius: 8px; }
.dx-o .iconbtn svg { width: 15px; height: 15px; }
.dx-f { display: flex; gap: 12px; flex-wrap: wrap; justify-content: space-between; }
.dx-c { display: flex; flex-direction: column; gap: 4px; }

/* exercises */
.search { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 0 12px; }
.search svg { color: var(--muted); }
.search input { flex: 1; min-width: 0; height: 46px; border: 0; background: none; outline: none; font-size: 15px; }
.eq-badge { width: 36px; height: 36px; flex: none; border-radius: 10px; display: grid; place-items: center; font: 700 13px var(--f-display); text-transform: uppercase; background: var(--surface2); color: var(--muted); }
.eq-barbell { background: var(--accent-soft); color: var(--accent); } .eq-dumbbell { background: var(--good-soft); color: var(--good); } .eq-cable { background: var(--warn-soft); color: var(--warn); } .eq-machine { background: var(--bad-soft); color: var(--bad); } .eq-smith { background: var(--gold-soft); color: var(--gold); }
.ex-hero { display: flex; flex-direction: column; gap: 14px; }
.mmap { display: flex; justify-content: center; gap: 18px; }
.mmap svg { width: 110px; height: 188px; }
.mm-head { fill: var(--surface2); } .mm-o { fill: var(--surface2); } .mm-s { fill: color-mix(in srgb, var(--accent) 40%, var(--surface2)); } .mm-p { fill: var(--accent); }
.mm-legend { display: flex; justify-content: center; gap: 14px; font-size: 11px; font-weight: 700; color: var(--muted); }
.mm-legend span { display: inline-flex; gap: 5px; align-items: center; }
.mm-legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.mm-legend i.mm-p { background: var(--accent); } .mm-legend i.mm-s { background: color-mix(in srgb, var(--accent) 40%, var(--surface2)); }
.ex-facts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
.ex-facts b { display: block; font-size: 14px; }
.ex-acts { display: flex; gap: 8px; flex-wrap: wrap; }
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stat-grid > div { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; }
.stat-grid b { font: 700 30px/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.stat-grid b small { font-size: 15px; }
.steps { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; }
.steps li::marker { font: 700 16px var(--f-display); color: var(--accent); }
.two-col { display: grid; grid-template-columns: 1fr; gap: 10px; }
@media (min-width: 480px) { .two-col { grid-template-columns: 1fr 1fr; } }
.tipcard ul { margin: 6px 0 0; padding-left: 18px; font-size: 14px; display: flex; flex-direction: column; gap: 5px; }
.lbl.good { color: var(--good); } .lbl.bad { color: var(--bad); }
.rr-row { display: flex; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
.rr-row > div { flex: 1 1 90px; background: var(--surface2); border-radius: 12px; padding: 8px 10px; display: flex; flex-direction: column; }
.rr-row b { font: 700 22px var(--f-display); }
.rr-row span { font-size: 11px; color: var(--muted); }
.hist-line { justify-content: space-between; text-align: left; }
.hist-line .num { font: 600 15px var(--f-display); text-align: right; color: var(--muted); }

/* progress */
.ex-sel { margin-bottom: 10px; font-weight: 700; }
.pg-sum { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0 6px; }
.pg-sum b { display: block; font: 700 26px/1.1 var(--f-display); }
.pg-sum b small { font-size: 13px; }
.chart { width: 100%; height: auto; display: block; }
.c-grid { stroke: var(--line); stroke-width: 1; }
.c-lbl { fill: var(--muted); font: 600 10px var(--f-body); }
.c-tl { fill: var(--good); }
.c-line { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; }
.c-dot { fill: var(--surface); stroke: var(--accent); stroke-width: 1.5; }
.c-end { fill: var(--accent); stroke: var(--surface); stroke-width: 2.5; }
.c-bar { fill: color-mix(in srgb, var(--accent) 45%, var(--surface2)); } .c-bar.now { fill: var(--accent); }
.c-target { stroke: var(--good); stroke-width: 1.5; stroke-dasharray: 4 4; }
.chart-empty { color: var(--muted); font-size: 13px; padding: 24px 8px; text-align: center; }
.freq { display: grid; grid-template-columns: 90px 1fr 40px 64px; gap: 8px; align-items: center; padding: 9px 14px; border-bottom: 1px solid var(--line); font-size: 13px; font-weight: 600; }
.freq b { font: 700 16px var(--f-display); text-align: right; }
.freq .muted { text-align: right; }
.dots { display: flex; gap: 4px; }
.dots i { width: 14px; height: 14px; border-radius: 4px; background: var(--surface2); }
.dots i.on { background: var(--accent); }
.cal { display: flex; gap: 4px; justify-content: center; }
.cal-days { display: flex; flex-direction: column; gap: 4px; margin-right: 2px; }
.cal-days span { height: 16px; font-size: 9px; font-weight: 700; color: var(--muted); line-height: 16px; }
.cal-col { display: flex; flex-direction: column; gap: 4px; }
.cal-col i { width: 16px; height: 16px; border-radius: 4px; background: var(--surface2); }
.cal-col i.on { background: var(--accent); }
.cal-col i.fut { opacity: .3; }
.cons { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
.cons > div { display: grid; grid-template-columns: 1fr 90px 60px; gap: 10px; align-items: center; font-size: 13px; font-weight: 600; }

/* ---------- Derived analytics (cached per revision) ---------- */

let IDX_CACHE = { rev: -1 };

      const sets = validSets(e);

      muscleLast[ex.muscle] = s.date;

/* ---------- Progressive overload: what to do next time ---------- */
function suggest(exId, repMin, repMax, nSets, beforeDate) {

  const last = hist[hist.length - 1];
  const U = unitLabel();
  const range = `${repMin}–${repMax}`;
  if (!last) {
    return { mode: 'new', short: 'First time', msg: `First time logging this. Pick a weight you could lift for about ${repMax + 2} reps, so you finish each set with around 2 reps in reserve.`, targets: Array.from({ length: nSets }, () => ({ w: null, r: repMin })), last: null };
  }

  const bw = ex.eq === 'bodyweight';

    const e1 = entryE1(last);

      const w = roundToInc((pick(i).w || 0) + inc, ex);
      let r = repMin;

      return { w, r };

      ? `You hit ${repMax}+ reps on every set. Add ${fmtW(inc)} ${U} with a belt or dumbbell, or keep adding reps.`
      : `You reached the top of your ${range} range on every set last time. Increase from ${fmtW(W)} to ${fmtW(nw)} ${U}.`, targets };

    const prev = hist[hist.length - 2];

    if (twice && W > 0) {
      const nw = roundToInc(W * 0.92, ex);
      res = { mode: 'reduce', short: `↓ ${fmtW(nw)} ${U}`, msg: `Two sessions below ${repMin} reps at ${fmtW(W)} ${U}. Drop to ${fmtW(nw)} ${U} and build back up through the ${range} range.`,
        targets: Array.from({ length: nSets }, (_, i) => ({ w: roundToInc((pick(i).w || 0) * 0.92, ex), r: repMin + 1 })) };
    } else {
      res = { mode: 'hold', short: `= ${fmtW(W, bw)}${W ? ' ' + U : ''}`, msg: `Last time the first set was below ${repMin} reps. Keep ${fmtW(W, bw)}${W ? ' ' + U : ''} and aim for at least ${repMin} on every set.`,
        targets: Array.from({ length: nSets }, (_, i) => ({ w: pick(i).w || 0, r: Math.max(repMin, pick(i).r + 1) })) };
    }

}

  const days = t.plan.map((d, i) => {
    const used = new Set();
    const exercises = [];
    d.slice(1).forEach((slot, j) => {
      const [key, flag] = slot.split(':');
      const id = pickFromSlot(key, used);

}

/* Which programme day is next: today's scheduled day if not done yet, otherwise rotation after the last one done */
function nextProgrammeDay() {
  const p = S.programme; if (!p || !p.days.length) return null;
  const done = sortedSessions().filter(s => s.dayId && p.days.some(d => d.id === s.dayId));
  const today = new Date().getDay();
  const todayStart = startOfDay(Date.now());
  const sched = p.days.find(d => d.weekday === today);
  if (sched && !done.some(s => s.dayId === sched.id && s.date >= todayStart)) {
    const doneThisWeekToday = done.some(s => s.date >= todayStart);
    if (!doneThisWeekToday) return { day: sched, reason: 'Scheduled for today' };
  }
  const last = done[done.length - 1];
  if (!last) return { day: p.days[0], reason: 'Start of your programme' };
  const i = p.days.findIndex(d => d.id === last.dayId);
  return { day: p.days[(i + 1) % p.days.length], reason: `Follows ${last.name}` };
}
function dayMuscles(day) {
  const set = []; day.exercises.forEach(e => { const m = exById(e.exId).muscle; if (!set.includes(m) && m !== 'other') set.push(m); }); return set;
}

/* ---------- Smart session generator ---------- */
function generateWorkout(muscles, size = 'standard', variety = 0, avoid = []) {
  const target = { short: 4, standard: 6, long: 8 }[size] || 6;
  const w = m => (MUSCLES.find(x => x.id === m) || {}).big ? 2 : 1;
  let ms = muscles.slice();
  // most rested muscles first so they get priority when slots are scarce
  ms.sort((a, b) => (muscleDays(b) ?? 99) - (muscleDays(a) ?? 99));
  if (ms.length > target) ms = ms.slice(0, target);
  const alloc = Object.fromEntries(ms.map(m => [m, 1]));
  let left = target - ms.length;
  const totalW = ms.reduce((a, m) => a + w(m), 0);
  const order = ms.slice().sort((a, b) => w(b) - w(a));
  let guard = 0;
  while (left > 0 && guard++ < 50) {
    for (const m of order) { if (left <= 0) break; if (alloc[m] < Math.max(1, Math.ceil(target * w(m) / totalW)) + (ms.length <= 2 ? 2 : 0)) { alloc[m]++; left--; } }
    if (guard > 10) { for (const m of order) { if (left <= 0) break; alloc[m]++; left--; } }
  }
  const progIds = new Set(); (S.programme?.days || []).forEach(d => d.exercises.forEach(e => progIds.add(e.exId)));
  const recent = new Set(); S.sessions.filter(s => Date.now() - s.date < 2 * DAY).forEach(s => s.exercises.forEach(e => recent.add(e.exId)));
  const chosen = [];
  const rnd = () => Math.random() * (1 + variety * 1.5);
  for (const m of ms) {
    const pats = new Set();
    for (let k = 0; k < alloc[m]; k++) {
      const cands = allExercises().filter(e => e.muscle === m && isAvailable(e) && !chosen.some(c => c.exId === e.id));
      if (!cands.length) break;
      const scored = cands.map(e => {
        let sc = 0;
        if (k === 0) sc += e.type === 'heavy' ? 4 : e.type === 'compound' ? 3 : 0;
        else sc += e.type === 'isolation' ? 1.5 : e.type === 'compound' ? 1.2 : 0.2;
        if (pats.has(e.pat)) sc -= 3;
        if (progIds.has(e.id)) sc += 2;
        if (S.settings.liked.includes(e.id)) sc += 2.5;
        sc += Math.min(1.5, exHistory(e.id).length * 0.25);
        if (recent.has(e.id)) sc -= 3;
        if (avoid.includes(e.id)) sc -= k === 0 ? 1.5 : 3.5;
        if (e.id === 'deadlift' && ms.includes('back') && !ms.includes('hamstrings')) sc -= 2;
        sc += rnd();
        return { e, sc };
      }).sort((a, b) => b.sc - a.sc);
      const e = scored[0].e;
      pats.add(e.pat);
      chosen.push(defaultPrescription(e, false));
    }
  }
  const rank = e => { const ex = exById(e.exId); return (ex.type === 'heavy' ? 0 : ex.type === 'compound' ? 1 : 2) * 10 + (MUSCLES.find(x => x.id === ex.muscle)?.big ? 0 : 1); };
  chosen.sort((a, b) => rank(a) - rank(b));
  if (chosen[0] && exById(chosen[0].exId).type === 'heavy') Object.assign(chosen[0], defaultPrescription(exById(chosen[0].exId), true));
  return chosen;
}
function presetName(muscles) {
  const key = muscles.slice().sort().join(',');
  const p = GEN_PRESETS.find(g => g.muscles.slice().sort().join(',') === key);
  if (p) return p.name;
  return muscles.map(m => MUSCLE_NAME[m]).join(' + ');
}

/* ---------- Workout sessions ---------- */
function newSessionFrom(name, items, dayId) {
  const s = { id: uid(), name, dayId: dayId || null, date: Date.now(), start: Date.now(), end: null, notes: '', exercises: [] };
  items.forEach(it => s.exercises.push(sessionExercise(it, s.date)));

}
function sessionExercise(it, beforeDate) {
  const ex = exById(it.exId);

  return {
    id: uid(), exId: it.exId, repMin: it.repMin, repMax: it.repMax, main: !!it.main, note: '',

}

/* ---------- Coach insights for the home screen ---------- */
function insights() {
  const out = [];
  const ss = sortedSessions();
  const now = Date.now();
  const last = ss[ss.length - 1];
  const U = unitLabel();
  const targetDays = S.settings.days;
  // Recovery / rest day
  const last3 = new Set(ss.filter(s => now - s.date < 3 * DAY).map(s => startOfDay(s.date))).size;
  const last7 = ss.filter(s => now - s.date < 7 * DAY).length;
  const trainedToday = last && startOfDay(last.date) === startOfDay(now);
  if (!trainedToday && (last3 >= 3 || last7 >= targetDays + 1)) out.push({ key: 'rest:' + startOfDay(now), kind: 'rest', title: 'Consider a rest day', body: `You've trained ${last3 >= 3 ? '3 days in a row' : `${last7} times in the last 7 days`}. Muscle is built during recovery — a day off now can make your next session stronger.` });
  // Performance drop in last session
  if (last) {
    let drops = 0, total = 0;
    last.exercises.forEach(e => { const sets = validSets(e); if (!sets.length) return; const prev = lastEntry(e.exId, last.date); if (!prev) return; total++; const a = Math.max(...sets.map(x => e1rm(x.w, x.r))), b = entryE1(prev); if (b && a < b * 0.97) drops++; });
    if (drops >= 3) out.push({ key: 'drop:' + last.id, kind: 'down', title: 'Performance dipped last session', body: `${drops} of ${total} exercises were weaker than the time before. Prioritise sleep and food, and hold off adding volume until numbers recover.` });
    // New e1RM PR last session
    const prs = IDX().prEvents.filter(p => p.sid === last.id && p.type === 'e1rm');
    if (prs.length) { const p = prs[0]; out.push({ key: 'pr:' + last.id, kind: 'pr', title: `New ${exById(p.exId).name} record`, body: `Estimated 1RM ${p.value}${prs.length > 1 ? ` — plus ${prs.length - 1} more record${prs.length > 2 ? 's' : ''} in ${last.name}` : ''}.`, action: { label: 'View', go: ['exercise', p.exId] } }); }
  }
  // Progression calls for the next programme day
  const nx = nextProgrammeDay();
  if (nx && ss.length) {
    const ups = [];
    nx.day.exercises.forEach(e => { const sg = suggest(e.exId, e.repMin, e.repMax, e.sets); if (sg.mode === 'increase') ups.push({ e, sg }); });
    if (ups.length) {
      const f = ups[0];
      const W = entryTopW(f.sg.last);
      out.push({ key: 'up:' + nx.day.id + ':' + (last ? last.id : ''), kind: 'up', title: `Go heavier on ${nx.day.name}`, body: `${exById(f.e.exId).name}: you hit the top of the ${f.e.repMin}–${f.e.repMax} range on every set. Increase from ${fmtW(W)} to ${fmtW(f.sg.targets[0].w)} ${U}.${ups.length > 1 ? ` ${ups.length - 1} more exercise${ups.length > 2 ? 's are' : ' is'} ready to go up too.` : ''}` });
    }
  }
  // Stalled lifts in the programme (only the most stalled one, so the coach stays quiet)
  let stallShown = false;
  (S.programme?.days || []).forEach(d => d.exercises.forEach((e, i) => {
    if (stallShown) return;
    const st = stallInfo(e.exId); if (!st || S.dismissed[`stall:${e.exId}:${exHistory(e.exId).length}`]) return;
    stallShown = true;
    const ex = exById(e.exId);
    const alts = alternatives(e.exId).filter(a => isAvailable(a) && a.pat === ex.pat).slice(0, 1);
    out.push({ key: `stall:${e.exId}:${exHistory(e.exId).length}`, kind: 'stall', title: `${ex.name} has stalled`, body: `${fmtW(st.w, ex.eq === 'bodyweight')}${st.w ? ' ' + U : ''} × ${st.reps} for ${st.n} sessions without progress. Keep it one more session, change the rep range, or swap it${alts[0] ? ` for ${alts[0].name}` : ''}.`, action: alts[0] ? { label: `Swap for ${alts[0].name}`, swap: [d.id, i, alts[0].id] } : null });
  }));
  // Neglected muscles (only those in the programme)
  const progMuscles = new Set(); (S.programme?.days || []).forEach(d => dayMuscles(d).forEach(m => progMuscles.add(m)));
  if (ss.length) progMuscles.forEach(m => {
    const d = muscleDays(m);
    if (d != null && d >= 8) out.push({ key: `muscle:${m}:${IDX().muscleLast[m]}`, kind: 'muscle', title: `${MUSCLE_NAME[m]}: ${d} days since last trained`, body: `You haven't trained ${MUSCLE_NAME[m].toLowerCase()} in ${d} days. Hitting each muscle at least twice a week is best for growth.`, action: { label: `Generate ${MUSCLE_NAME[m]} workout`, gen: [m] } });
  });
  // Volume trend for pressing / pulling / legs
  const groups = { pressing: ['hpush', 'inpush', 'vpush', 'dip'], pulling: ['hpull', 'vpull'], 'leg': ['squat', 'legpress', 'lunge', 'hinge'] };
  const vol = (pats, a, b) => ss.filter(s => s.date >= a && s.date < b).reduce((t, s) => t + s.exercises.filter(e => pats.includes(exById(e.exId).pat)).reduce((x, e) => x + validSets(e).reduce((y, st) => y + (st.w || 0) * st.r, 0), 0), 0);
  for (const [g, pats] of Object.entries(groups)) {
    const cur = vol(pats, now - 14 * DAY, now + DAY), prev = vol(pats, now - 28 * DAY, now - 14 * DAY);
    if (prev > 0 && cur > prev * 1.2) { out.push({ key: `vol:${g}:${startOfWeek(now)}`, kind: 'volume', title: `${g[0].toUpperCase() + g.slice(1)} volume up ${Math.round((cur / prev - 1) * 100)}%`, body: `Your ${g} volume over the last two weeks is well above the two weeks before. Good progress — keep an eye on joints and recovery.` }); break; }
  }
  // Weekly set volume too low for a big muscle
  const ws = weeklySets(now - 7 * DAY);
  if (ss.filter(s => now - s.date < 14 * DAY).length >= 3 && S.programme) {
    for (const m of ['chest', 'back', 'quads', 'hamstrings']) {
      if (!progMuscles.has(m) || ws[m] >= 8) continue;
      let target = null;
      S.programme.days.forEach(d => d.exercises.forEach((e, i) => { const ex = exById(e.exId); if (!target && ex.muscle === m && e.sets < 5) { const sg = suggest(e.exId, e.repMin, e.repMax, e.sets); if (sg.mode === 'increase' || sg.mode === 'reps') target = { d, i, e, ex }; } }));
      if (target) { out.push({ key: `sets:${m}:${startOfWeek(now)}`, kind: 'sets', title: `Low ${MUSCLE_NAME[m].toLowerCase()} volume`, body: `${MUSCLE_NAME[m]} got about ${Math.round(ws[m])} hard sets this week. 10–20 weekly sets tends to work best for growth, and ${target.ex.name} is still progressing — add a set.`, action: { label: `Add a set to ${target.ex.name}`, addSet: [target.d.id, target.i] } }); break; }
    }
  }
  return out.filter(r => !S.dismissed[r.key]);
}

/* ---------- Demo data ---------- */
function makeDemoSessions() {
  const p = S.programme; if (!p) return [];
  const days = p.days;
  const sessions = [];
  const state = {};
  const now = Date.now();
  // walk back 5 weeks following the weekday schedule (or every other day)
  const schedule = [];
  for (let d = 35; d >= 1; d--) {
    const t = startOfDay(now - d * DAY);
    const wd = new Date(t).getDay();
    const hasWd = days.some(x => x.weekday != null);
    if (hasWd ? days.some(x => x.weekday === wd) : d % 2 === 0) schedule.push(t);
  }
  let di = 0;
  const stallEx = days[0].exercises[1]?.exId;
  schedule.forEach((t, si) => {
    const day = days[di % days.length]; di++;
    const start = t + (17 + (si % 3)) * 3600000 + (si * 7 % 50) * 60000;
    const s = { id: 'demo-' + si, demo: true, name: day.name, dayId: day.id, date: start, start, end: start + (52 + (si * 13 % 25)) * 60000, notes: si === schedule.length - 2 ? 'Felt strong today, slept well.' : '', exercises: [], updatedAt: now };
    day.exercises.forEach(it => {
      const ex = exById(it.exId);
      const st = state[it.exId] = state[it.exId] || { w: roundToInc(DEMO_BASE[it.exId] ?? (ex.eq === 'bodyweight' ? 0 : ex.type === 'isolation' ? (ex.eq === 'dumbbell' ? 12 : 30) : (ex.eq === 'dumbbell' ? 24 : 60)), ex), r: it.repMin + 1 };
      const stall = it.exId === stallEx && si >= schedule.length - 3 * days.length;
      const sets = [];
      for (let k = 0; k < it.sets; k++) {
        let r = st.r >= it.repMax && !stall ? it.repMax : clamp(st.r - (k === 0 ? 0 : k === 1 ? (si % 2) : 1 + (si % 2)), it.repMin, it.repMax);
        sets.push({ id: uid(), w: st.w, r, done: true });
      }
      if (si === 3 && it === day.exercises[0]) sets[0].note = 'Paused first rep';
      s.exercises.push({ id: uid(), exId: it.exId, repMin: it.repMin, repMax: it.repMax, main: it.main, note: si === 0 && it === day.exercises[0] ? 'Seat height 4, grip ring finger on rings' : '', sets });
      if (stall) { st.r = Math.max(it.repMin, Math.min(st.r, it.repMax - 2)); return; }
      if (sets.every(x => x.r >= it.repMax)) { st.w = roundToInc(st.w + incrementFor(ex), ex); st.r = it.repMin; }
      else st.r = Math.min(it.repMax, st.r + 1);
    });
    sessions.push(s);
  });
  return sessions;
}
function clearDemo() {
  S.sessions.filter(s => s.demo).forEach(s => { S.deleted[s.id] = Date.now(); });
  S.sessions = S.sessions.filter(s => !s.demo);

  const keep = S.sync;

  S = Object.assign(defaultState(), { settings: Object.assign(defaultSettings(), d.settings || {}), programme: d.programme || null, customExercises: d.customExercises || [], sessions: d.sessions, active: d.active || null, onboarded: true, hasDemo: !!d.hasDemo, dismissed: d.dismissed || {}, deleted });
  d.sessions.forEach(s => { delete deleted[s.id]; });

const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function fmtDate(t, withYear) { const d = new Date(t); return `${WD[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}${withYear || d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : ''}`; }
function fmtShort(t) { const d = new Date(t); return `${d.getDate()} ${MON[d.getMonth()]}`; }
function fmtTime(t) { const d = new Date(t); return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; }
function ago(t) {
  const d = daysBetween(t, Date.now());
  if (d <= 0) return 'Today'; if (d === 1) return 'Yesterday'; if (d < 7) return `${d} days ago`;
  if (d < 14) return '1 week ago'; if (d < 60) return `${Math.floor(d / 7)} weeks ago`; return fmtDate(t, true);
}
function fmtDur(ms) { if (!ms || ms < 0) return '—'; const m = Math.round(ms / 60000); if (m < 60) return `${m} min`; return `${Math.floor(m / 60)} h ${m % 60} min`; }
function fmtClock(sec) { sec = Math.max(0, Math.round(sec)); return `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`; }
function toLocalInput(t) { const d = new Date(t); const z = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}`; }
function setsText(sets, bw) { return sets.map(s => `${fmtW(s.w, bw)}${s.w ? '' : ''} × ${s.r}`); }

/* ---------- Charts (inline SVG, drawn to scale) ---------- */
function niceTicks(min, max, n = 4) {
  if (min === max) { min -= 1; max += 1; }
  const span = max - min, step0 = span / n, mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= step0) || step0;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
  const t = []; for (let v = lo; v <= hi + step / 2; v += step) t.push(Math.round(v * 1000) / 1000);
  return t;
}
function lineChart(pts, opts = {}) {
  if (pts.length < 2) return `<div class="chart-empty">${pts.length ? 'One session logged so far — the chart appears after your second.' : 'No data yet.'}</div>`;
  const W = 340, H = opts.h || 170, L = 38, R = 12, T = 12, B = 24;
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const ticks = niceTicks(Math.min(...ys), Math.max(...ys));
  const y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const sx = x => L + (x1 === x0 ? 0.5 : (x - x0) / (x1 - x0)) * (W - L - R);
  const sy = y => T + (1 - (y - y0) / (y1 - y0 || 1)) * (H - T - B);
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${sx(p.x).toFixed(1)},${sy(p.y).toFixed(1)}`).join('');
  const area = `${line}L${sx(x1).toFixed(1)},${H - B}L${sx(x0).toFixed(1)},${H - B}Z`;
  const grid = ticks.map(t => `<line x1="${L}" x2="${W - R}" y1="${sy(t)}" y2="${sy(t)}" class="c-grid"/><text x="${L - 6}" y="${sy(t) + 3.5}" class="c-lbl" text-anchor="end">${opts.fmt ? opts.fmt(t) : t}</text>`).join('');
  const lp = pts[pts.length - 1];
  const dots = pts.length <= 24 ? pts.map(p => `<circle cx="${sx(p.x)}" cy="${sy(p.y)}" r="2.4" class="c-dot"/>`).join('') : '';
  const gid = 'g' + Math.random().toString(36).slice(2, 7);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label || 'Chart')}">
    <defs><linearGradient id="${gid}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".28"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
    ${grid}<path d="${area}" fill="url(#${gid})"/><path d="${line}" class="c-line"/>${dots}
    <circle cx="${sx(lp.x)}" cy="${sy(lp.y)}" r="5" class="c-end"/>
    <text x="${L}" y="${H - 6}" class="c-lbl">${fmtShort(x0)}</text><text x="${W - R}" y="${H - 6}" class="c-lbl" text-anchor="end">${fmtShort(x1)}</text>
  </svg>`;
}
function barChart(vals, labels, opts = {}) {
  const W = 340, H = opts.h || 150, L = 30, R = 8, T = 12, B = 22;
  const max = Math.max(opts.target || 0, ...vals, 1);
  const ticks = niceTicks(0, max, 3); const top = ticks[ticks.length - 1];
  const bw = (W - L - R) / vals.length;
  const sy = v => T + (1 - v / top) * (H - T - B);
  const grid = ticks.map(t => `<line x1="${L}" x2="${W - R}" y1="${sy(t)}" y2="${sy(t)}" class="c-grid"/><text x="${L - 6}" y="${sy(t) + 3.5}" class="c-lbl" text-anchor="end">${opts.fmt ? opts.fmt(t) : t}</text>`).join('');
  const bars = vals.map((v, i) => { const h = Math.max(v ? 2 : 0, (H - T - B) - (sy(v) - T)); return `<rect x="${(L + i * bw + bw * 0.18).toFixed(1)}" y="${(H - B - h).toFixed(1)}" width="${(bw * 0.64).toFixed(1)}" height="${h.toFixed(1)}" rx="3" class="${i === vals.length - 1 ? 'c-bar now' : 'c-bar'}"/>`; }).join('');
  const lbls = labels.map((l, i) => l ? `<text x="${(L + i * bw + bw / 2).toFixed(1)}" y="${H - 6}" class="c-lbl" text-anchor="middle">${l}</text>` : '').join('');
  const tgt = opts.target ? `<line x1="${L}" x2="${W - R}" y1="${sy(opts.target)}" y2="${sy(opts.target)}" class="c-target"/><text x="${W - R}" y="${sy(opts.target) - 4}" class="c-lbl c-tl" text-anchor="end">Target ${opts.target}</text>` : '';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label || 'Bar chart')}">${grid}${bars}${tgt}${lbls}</svg>`;
}
function spark(vals) {
  if (vals.length < 2) return '';
  const W = 90, H = 30, mn = Math.min(...vals), mx = Math.max(...vals);
  const sx = i => 2 + i / (vals.length - 1) * (W - 4), sy = v => 3 + (1 - (v - mn) / (mx - mn || 1)) * (H - 6);
  const d = vals.map((v, i) => `${i ? 'L' : 'M'}${sx(i).toFixed(1)},${sy(v).toFixed(1)}`).join('');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true"><path d="${d}" class="c-line"/><circle cx="${sx(vals.length - 1)}" cy="${sy(vals[vals.length - 1])}" r="2.8" class="c-end"/></svg>`;
}

  }
  if (S.programme) h += `<section class="sec"><button class="split-row" data-a="tab" data-v="programme"><span class="muted xs">Current split</span><b>${esc(S.programme.name)}</b><span class="muted sm">${S.programme.days.length} days · ${S.programme.days.map(d => esc(d.name)).join(' · ')}</span><span class="chev">${I.right}</span></button></section>`;

function prRow(p) {
  const ex = exById(p.exId);
  return `<button class="pr-row" data-a="go" data-v="exercise" data-p="${p.exId}"><span class="pr-ic">${I.trophy}</span><div class="grow"><div class="pr-ex">${esc(ex.name)}</div><div class="muted xs">${esc(p.label)} · ${ago(p.date)}</div></div><b class="num">${esc(p.value)}</b></button>`;

function highlights() {
  const out = [];
  const now = Date.now();
  Object.entries(IDX().byEx).filter(([, h]) => h.length >= 3).sort((a, b) => b[1].length - a[1].length).slice(0, 6).forEach(([id, h]) => {
    const recent = h.filter(x => now - x.date < 42 * DAY);
    if (recent.length < 2) return;
    const vals = recent.map(entryE1).filter(v => v > 0);
    if (vals.length < 2) return;
    const diff = Math.max(...vals.slice(-2)) - vals[0];
    out.push({ id, name: exById(id).name, diff, vals, weeks: Math.max(1, Math.round((recent[recent.length - 1].date - recent[0].date) / (7 * DAY))) });
  });
  return out.sort((a, b) => b.diff - a.diff).slice(0, 3);
}
function heroCard() {

function weekCard() {
  const ws = startOfWeek(Date.now());
  const days = Array.from({ length: 7 }, (_, i) => ws + i * DAY);
  const sess = S.sessions.filter(s => s.date >= ws);
  const planned = new Set((S.programme?.days || []).map(d => d.weekday).filter(x => x != null));
  const today = startOfDay(Date.now());
  const cells = days.map(t => {
    const n = sess.filter(s => startOfDay(s.date) === t).length;
    const wd = new Date(t).getDay();
    return `<div class="wd ${n ? 'hit' : ''} ${planned.has(wd) ? 'plan' : ''} ${t === today ? 'today' : ''}"><span>${WD[wd][0]}</span><i></i></div>`;
  }).join('');
  const target = S.settings.days;
  return `<section class="sec"><div class="card week">
    <div class="wk-l"><div class="muted xs">This week</div><div class="wk-n"><b>${sess.length}</b><span>/ ${target} sessions</span></div><div class="muted xs">${fmtVol(sess.reduce((a, s) => a + sessionVolume(s), 0))} ${unitLabel()} lifted</div></div>
    <div class="wk-days">${cells}</div></div></section>`;
}

function muscleCard() {

    <div class="mgrid">${rows.map(r => { const st = muscleStatus(r.d); return `<div class="mcell s-${st.k}"><span class="mc-n">${MUSCLE_NAME[r.m]}</span><span class="mc-d">${r.d == null ? '—' : r.d === 0 ? 'Today' : r.d + 'd'}</span><i style="--p:${r.d == null ? 0 : Math.min(1, r.d / 7)}"></i></div>`; }).join('')}</div>
    <div class="legend"><span class="s-recovering"><i></i>Recovering</span><span class="s-ready"><i></i>Ready</span><span class="s-due"><i></i>Due</span><span class="s-overdue"><i></i>Overdue</span></div>

function vActive() {
  const a = S.active;
  const done = a.exercises.reduce((t, e) => t + e.sets.filter(s => s.done).length, 0);
  const tot = a.exercises.reduce((t, e) => t + e.sets.length, 0);
  const vol = a.exercises.reduce((t, e) => t + e.sets.filter(s => s.done || s.r > 0).reduce((x, s) => x + (s.w || 0) * (s.r || 0), 0), 0);
  const curIdx = a.exercises.findIndex(e => e.sets.some(s => !s.done));
  let h = `<div class="wk-head">
    <button class="wk-title" data-a="rename" data-ctx="active"><span>${esc(a.name)}</span>${I.edit}</button>
    <span class="wk-clock num" data-live="elapsed">${fmtClock((Date.now() - a.start) / 1000)}</span>
    <button class="btn solid sm" data-a="finish">Finish</button></div>`;
  h += `<div class="wk-sub"><div class="prog-bar"><i style="width:${tot ? done / tot * 100 : 0}%"></i></div><span class="num">${done}/${tot} sets · ${fmtVol(vol)} ${unitLabel()}</span>
    <button class="link sm" data-a="toggle-snotes">${I.note}${a.notes ? 'Notes ·' : 'Add notes'}</button></div>`;
  if (a.notes || UI.openNotes.session) h += `<textarea class="notes" data-f="snotes" data-ctx="active" placeholder="How did the session feel? Sleep, energy, anything to remember…">${esc(a.notes)}</textarea>`;
  if (!a.exercises.length) h += `<div class="empty big">Add your first exercise to get going.</div>`;
  h += a.exercises.map((e, i) => exCard('active', a, e, i, i === curIdx)).join('');

/* Exercise card used both during a live workout (ctx=active) and when editing history (ctx=edit) */
function exCard(ctx, s, e, ei, current) {
  const ex = exById(e.exId);
  const bw = ex.eq === 'bodyweight';
  const live = ctx === 'active';
  const tpl = `40px minmax(0,1fr) minmax(0,1fr)${S.settings.showRPE ? ' minmax(0,.75fr)' : ''}${S.settings.showRIR ? ' minmax(0,.75fr)' : ''}${live ? ' 52px' : ''}`;
  const allDone = live && e.sets.length && e.sets.every(x => x.done);
  let h = `<section class="xcard${current ? ' current' : ''}${allDone ? ' complete' : ''}" id="x-${ei}">
    <header class="xh"><span class="xnum">${ei + 1}</span>
      <button class="xt" data-a="go" data-v="exercise" data-p="${ex.id}"><b>${esc(ex.name)}</b><span>${esc(MUSCLE_NAME[ex.muscle])} · ${esc(EQUIP_NAME[ex.eq] || '')} · ${e.repMin}–${e.repMax} reps</span></button>
      <button class="iconbtn" data-a="exmenu" data-ctx="${ctx}" data-ei="${ei}" aria-label="Exercise options">${I.dots}</button></header>`;
  if (live) {
    const last = lastEntry(e.exId, s.date);
    const lastLines = last ? last.sets.map(x => `<div>${fmtW(x.w, bw)}${x.w || !bw ? '' : ''} × ${x.r}</div>`).join('') : '<div class="muted">First time</div>';
    const tgt = e.sets.map(x => {
      if (x.tr == null && x.tw == null) return '';
      const up = last && x.tw != null && x.tw > entryTopW(last) + 0.001;
      return `<div class="${up ? 'up' : ''}">${x.tw != null ? fmtW(x.tw, bw) : '?'} × ${x.tr}</div>`;
    }).join('');
    h += `<div class="cmp"><div class="cmp-col"><span class="lbl">Last time${last ? ' · ' + ago(last.date).toLowerCase() : ''}</span>${lastLines}</div>
      <div class="cmp-col tgt"><span class="lbl">Today's target</span>${tgt || '<div class="muted">Choose a weight</div>'}</div></div>`;
    if (e.sug) h += `<div class="advice m-${e.sug.mode}"><b>${esc(e.sug.short)}</b><span>${esc(e.sug.msg)}</span></div>`;
    if (last && last.note) h += `<div class="lastnote">${I.note}<span>Last note: ${esc(last.note)}</span></div>`;
  }
  h += `<div class="sets" style="--tpl:${tpl}"><div class="shd"><span>Set</span><span>${unitLabel()}${bw ? ' +' : ''}</span><span>Reps</span>${S.settings.showRPE ? '<span>RPE</span>' : ''}${S.settings.showRIR ? '<span>RIR</span>' : ''}${live ? '<span></span>' : ''}</div>`;
  e.sets.forEach((x, si) => {
    const wv = x.w != null ? fmtNum(toUnit(x.w)) : '';
    const wph = x.tw != null ? fmtNum(toUnit(x.tw)) : (bw ? '0' : '');
    h += `<div class="srow${x.done ? ' done' : ''}${x.pr ? ' pr' : ''}${x.warm ? ' warm' : ''}">
      <button class="sno" data-a="setmenu" data-ctx="${ctx}" data-ei="${ei}" data-si="${si}" aria-label="Set ${si + 1} options">${x.warm ? 'W' : si + 1}${x.pr ? `<i class="prdot">${I.trophy}</i>` : ''}</button>
      <input class="num-in" data-f="w" data-ctx="${ctx}" data-ei="${ei}" data-si="${si}" inputmode="decimal" enterkeyhint="next" value="${wv}" placeholder="${wph}" aria-label="Weight set ${si + 1}">
      <input class="num-in" data-f="r" data-ctx="${ctx}" data-ei="${ei}" data-si="${si}" inputmode="numeric" enterkeyhint="done" value="${x.r != null ? x.r : ''}" placeholder="${x.tr != null ? x.tr : ''}" aria-label="Reps set ${si + 1}">
      ${S.settings.showRPE ? `<input class="num-in sm" data-f="rpe" data-ctx="${ctx}" data-ei="${ei}" data-si="${si}" inputmode="decimal" value="${x.rpe != null ? x.rpe : ''}" placeholder="–" aria-label="RPE">` : ''}
      ${S.settings.showRIR ? `<input class="num-in sm" data-f="rir" data-ctx="${ctx}" data-ei="${ei}" data-si="${si}" inputmode="numeric" value="${x.rir != null ? x.rir : ''}" placeholder="–" aria-label="Reps in reserve">` : ''}
      ${live ? `<button class="chk" data-a="done" data-ei="${ei}" data-si="${si}" aria-label="Complete set">${I.check}</button>` : ''}
    </div>`;
    if (x.note != null && (x.note !== '' || UI.openSetNotes[x.id])) h += `<input class="snote" data-f="snote" data-ctx="${ctx}" data-ei="${ei}" data-si="${si}" value="${esc(x.note)}" placeholder="Set note">`;
  });
  h += `</div><div class="xfoot">
    <button class="btn ghost sm" data-a="addset" data-ctx="${ctx}" data-ei="${ei}">${I.plus}Add set</button>
    ${live ? `<button class="btn ghost sm" data-a="rest" data-sec="${e.rest || 120}">${I.timer}${fmtClock(e.rest || 120)}</button>` : ''}
    <button class="btn ghost sm" data-a="exnote" data-ctx="${ctx}" data-ei="${ei}">${I.note}Note</button>
  </div>`;
  if (e.note || UI.openNotes[e.id]) h += `<textarea class="notes sm" data-f="enote" data-ctx="${ctx}" data-ei="${ei}" placeholder="Exercise note — seat height, grip, cues…">${esc(e.note)}</textarea>`;
  h += `</section>`;
  return h;
}

      <ul class="pd-list">${d.exercises.map(e => `<li><span>${esc(exById(e.exId).name)}</span><span class="num muted">${e.sets} × ${e.repMin}–${e.repMax}</span></li>`).join('') || '<li class="muted">No exercises yet</li>'}</ul>

function volBars(sets) {
  const max = Math.max(22, ...Object.values(sets));

}

/* ---------- PROGRESS ---------- */
function vProgress() {
  let h = topbar('Progress');
  const idx = IDX();
  const exIds = Object.keys(idx.byEx).sort((a, b) => idx.byEx[b].length - idx.byEx[a].length);
  if (!idx.sessions.length) return h + `<div class="empty big">Log your first workout and your progress will build up here.</div>`;
  const cur = UI.prog.ex && idx.byEx[UI.prog.ex] ? UI.prog.ex : exIds[0];
  UI.prog.ex = cur;
  const ex = exById(cur), hist = idx.byEx[cur], bw = ex.eq === 'bodyweight';
  const metric = UI.prog.metric;
  const val = x => metric === 'e1' ? entryE1(x) : metric === 'top' ? entryTopW(x) : metric === 'reps' ? x.sets.reduce((a, s) => Math.max(a, s.r), 0) : x.sets.reduce((a, s) => a + (s.w || 0) * s.r, 0);
  const pts = hist.map(x => ({ x: x.date, y: metric === 'reps' ? val(x) : Math.round(toUnit(val(x)) * 10) / 10 }));
  const first = pts[0]?.y || 0, lastv = pts[pts.length - 1]?.y || 0;
  const diff = lastv - first;
  h += `<section class="sec"><div class="sec-h"><h2>Exercise progress</h2></div><div class="card">
    <select class="ex-sel" data-f="prog-ex">${exIds.map(id => `<option value="${id}" ${id === cur ? 'selected' : ''}>${esc(exById(id).name)} (${idx.byEx[id].length})</option>`).join('')}</select>
    ${seg([['e1', 'Est. 1RM'], ['top', 'Top weight'], ['reps', 'Best reps'], ['vol', 'Volume']], metric, 'prog-metric')}
    <div class="pg-sum"><div><span class="lbl">Latest</span><b class="num">${metric === 'reps' ? lastv : fmtNum(lastv)}<small>${metric === 'reps' ? ' reps' : ' ' + unitLabel()}</small></b></div><div><span class="lbl">Change</span><b class="num ${diff >= 0 ? 'good' : 'bad'}">${diff >= 0 ? '+' : ''}${fmtNum(Math.round(diff * 10) / 10)}</b></div><div><span class="lbl">Sessions</span><b class="num">${hist.length}</b></div></div>
    ${lineChart(pts, { fmt: v => Math.round(v), label: `${ex.name} progress` })}
    <button class="link" data-a="go" data-v="exercise" data-p="${cur}">Full ${esc(ex.name)} history ${I.right}</button></div></section>`;
  // PRs
  const prs = idx.prEvents;
  if (prs.length) {
    const shown = UI.showAllPR ? prs.slice(0, 60) : prs.slice(0, 5);
    h += `<section class="sec"><div class="sec-h"><h2>Personal records</h2>${prs.length > 5 ? `<button class="link" data-a="toggle-pr">${UI.showAllPR ? 'Show less' : `All ${prs.length}`}</button>` : ''}</div><div class="card list">${shown.map(p => p.exId ? prRow(p) : `<button class="pr-row" data-a="go" data-v="session" data-p="${p.sid}"><span class="pr-ic">${I.trophy}</span><div class="grow"><div class="pr-ex">${esc(p.label)}</div><div class="muted xs">${ago(p.date)}</div></div><b class="num">${esc(p.value)}</b></button>`).join('')}</div></section>`;
  }
  // best lifts table
  const top = exIds.filter(id => idx.bests[id].bestE1 > 0).slice(0, 6);
  if (top.length) h += `<section class="sec"><div class="sec-h"><h2>Strength</h2><span class="muted xs">Best estimated 1RM</span></div><div class="card list">${top.map(id => { const b = idx.bests[id]; const hh = idx.byEx[id]; return `<button class="pr-row" data-a="prog-pick" data-id="${id}"><div class="grow"><div class="pr-ex">${esc(exById(id).name)}</div><div class="muted xs">Heaviest ${fmtW(b.maxW)} × ${b.maxWReps}</div></div>${spark(hh.slice(-10).map(entryE1))}<b class="num">${fmtW(Math.round(b.bestE1))}</b></button>`; }).join('')}</div></section>`;
  // sessions per week & volume
  const weeks = 12, ws = startOfWeek(Date.now());
  const wk = Array.from({ length: weeks }, (_, i) => ws - (weeks - 1 - i) * 7 * DAY);
  const cnt = wk.map(t => idx.sessions.filter(s => s.date >= t && s.date < t + 7 * DAY).length);
  const vol = wk.map(t => idx.sessions.filter(s => s.date >= t && s.date < t + 7 * DAY).reduce((a, s) => a + toUnit(sessionVolume(s)), 0));
  const lbl = wk.map((t, i) => i % 3 === 2 || i === weeks - 1 ? fmtShort(t) : '');
  h += `<section class="sec"><div class="sec-h"><h2>Sessions per week</h2><span class="muted xs">avg ${(cnt.slice(-4).reduce((a, b) => a + b, 0) / 4).toFixed(1)} last 4 wks</span></div><div class="card">${barChart(cnt, lbl, { target: S.settings.days, label: 'Sessions per week' })}</div></section>`;
  h += `<section class="sec"><div class="sec-h"><h2>Training volume</h2><span class="muted xs">${unitLabel()} lifted per week</span></div><div class="card">${barChart(vol, lbl, { fmt: v => v >= 1000 ? Math.round(v / 1000) + 'k' : v, label: 'Weekly volume' })}</div></section>`;
  // muscle frequency
  const sets7 = weeklySets(Date.now() - 7 * DAY);
  h += `<section class="sec"><div class="sec-h"><h2>Sets per muscle · last 7 days</h2></div><div class="card">${volBars(sets7)}<div class="muted xs pad-t">Shaded zone = 10–20 hard sets, a good weekly target for growth. Secondary muscles count as half a set.</div></div></section>`;
  const freq = TRACKED_MUSCLES.map(m => { const n = new Set(idx.sessions.filter(s => Date.now() - s.date < 28 * DAY && s.exercises.some(e => exById(e.exId).muscle === m && validSets(e).length)).map(s => startOfDay(s.date))).size; return { m, f: n / 4, d: muscleDays(m) }; });
  h += `<section class="sec"><div class="sec-h"><h2>Muscle frequency</h2><span class="muted xs">times per week · last 4 weeks</span></div><div class="card list">${freq.map(x => `<div class="freq"><span>${MUSCLE_NAME[x.m]}</span><div class="dots">${[0, 1, 2, 3].map(i => `<i class="${x.f > i + 0.25 ? 'on' : ''}"></i>`).join('')}</div><b class="num">${x.f.toFixed(1)}×</b><span class="muted xs">${x.d == null ? 'never' : x.d === 0 ? 'today' : x.d + 'd ago'}</span></div>`).join('')}</div></section>`;
  // consistency
  const calStart = ws - 11 * 7 * DAY;
  const daySet = new Set(idx.sessions.map(s => startOfDay(s.date)));
  let cal = '';
  for (let w = 0; w < 12; w++) { cal += '<div class="cal-col">'; for (let d = 0; d < 7; d++) { const t = calStart + (w * 7 + d) * DAY; cal += `<i class="${daySet.has(startOfDay(t)) ? 'on' : ''}${t > Date.now() ? ' fut' : ''}" title="${fmtShort(t)}"></i>`; } cal += '</div>'; }
  const cons = exIds.slice(0, 8).map(id => { const wset = new Set(idx.byEx[id].filter(x => x.date >= calStart).map(x => startOfWeek(x.date))); return { id, n: wset.size }; });
  h += `<section class="sec"><div class="sec-h"><h2>Consistency</h2><span class="muted xs">last 12 weeks</span></div><div class="card"><div class="cal"><div class="cal-days">${['M', '', 'W', '', 'F', '', 'S'].map(x => `<span>${x}</span>`).join('')}</div>${cal}</div>
    <div class="cons">${cons.map(c => `<div><span>${esc(exById(c.id).name)}</span><div class="cbar"><i style="width:${c.n / 12 * 100}%"></i></div><b class="num">${c.n}/12 wks</b></div>`).join('')}</div></div></section>`;
  return h;
}

function pickListHtml(sh) {
  const cur = sh.mode === 'replace' || sh.mode === 'add' ? getSess(sh.ctx).exercises.map(e => e.exId) : sh.mode.startsWith('day') ? S.programme.days.find(d => d.id === sh.dayId).exercises.map(e => e.exId) : UI.gen.items.map(e => e.exId);
  let h = '';
  const q = (sh.q || '').trim();
  if (sh.from && !q && !sh.m) {
    const alts = alternatives(sh.from, cur).slice(0, 8);
    if (alts.length) h += `<div class="month">Best alternatives</div><div class="card list">${alts.map(e => pickRow(e)).join('')}</div>`;
  }
  const list = filterExercises(q, sh.m || 'all', 'all', false).filter(e => !cur.includes(e.id) || e.id === sh.from).sort((a, b) => (isAvailable(b) - isAvailable(a)) || (exHistory(b.id).length - exHistory(a.id).length));
  h += `<div class="month">${q || sh.m ? 'Results' : 'All exercises'}</div><div class="card list">${list.slice(0, 80).map(e => pickRow(e)).join('') || '<div class="empty">No matches</div>'}</div>`;
  return h;
}

/* ---------- Rest timer bar ---------- */
function restBarHtml() {
  const T = UI.timer;
  const a = S.active;
  if (!a || UI.tab !== 'workout' || UI.stack.length) return '';
  const cur = a.exercises.find(e => e.sets.some(s => !s.done)) || a.exercises[a.exercises.length - 1];
  const def = cur ? cur.rest || 120 : S.settings.rest.compound;
  if (T.state === 'idle') return `<div class="rest idle"><span class="r-ic">${I.timer}</span><span class="grow muted sm">Rest timer</span><button class="btn solid sm" data-a="rest" data-sec="${def}">${I.play}${fmtClock(def)}</button></div>`;
  const left = T.state === 'run' ? (T.end - Date.now()) / 1000 : T.left;
  const pct = T.state === 'done' ? 100 : Math.max(0, Math.min(100, (1 - left / T.dur) * 100));
  return `<div class="rest ${T.state}"><div class="r-prog" style="width:${pct}%"></div>
    <b class="r-time num" data-live="rest">${T.state === 'done' ? 'Go!' : fmtClock(left)}</b>
    <div class="r-btns"><button class="iconbtn" data-a="t-add" aria-label="Add 30 seconds">+30</button>
    <button class="iconbtn" data-a="t-toggle" aria-label="${T.state === 'run' ? 'Pause' : 'Resume'}">${T.state === 'run' ? I.pause : I.play}</button>
    <button class="iconbtn" data-a="t-reset" aria-label="Reset">${I.reset}</button><button class="iconbtn" data-a="t-skip" aria-label="Skip">${I.skip}</button></div></div>`;
}
